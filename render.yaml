services:
  - type: web
    name: codenest-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URL
        sync: false
      - key: JWT_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CODEBOX_API_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
